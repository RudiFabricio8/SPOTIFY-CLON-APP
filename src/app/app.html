<div class="app-container" *ngIf="isLoggedIn$ | async">
  <app-sidebar class="app-sidebar"></app-sidebar>
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>

<div class="login-container" *ngIf="!(isLoggedIn$ | async)">
  <div class="login-card">
    <h1>Spotify Player</h1>
    <p>Inicia sesión para empezar a buscar y escuchar tus previews.</p>
    <button class="login-button" (click)="authServiceRef.login()">Iniciar sesión con Spotify</button>
  </div>
</div>
