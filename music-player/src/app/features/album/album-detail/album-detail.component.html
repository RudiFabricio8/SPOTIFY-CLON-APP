<div class="album-root"> <div *ngIf="loading"> <app-loader></app-loader> </div> <div *ngIf="album"> <div class="album-header"> <img *ngIf="album.images?.length" [src]="album.images[0].url" [alt]="album.name" /> <div class="album-meta"> <h2>{{ album.name }}</h2> <p>{{ album.artists.map(a => a.name).join(', ') }}</p> <button (click)="playAlbum()">Play Album</button> </div> </div> <div class="album-tracks"> <div *ngFor="let t of album.tracks?.items; let i = index" class="track-row"> <div class="track-info">{{ t.track_number }}. {{ t.name }}</div> <div class="track-actions"> <button (click)="playTrack(i)">Play</button> </div> </div> </div> </div> </div>
