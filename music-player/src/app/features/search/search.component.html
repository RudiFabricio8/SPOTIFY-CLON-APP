<div class="search-root"> <div class="search-box"> <input [(ngModel)]="query" placeholder="Search tracks or albums" /> <button (click)="doSearch()">Search</button> </div> <div class="search-results"> <app-loader *ngIf="loading"></app-loader> <div *ngIf="!loading"> <div *ngFor="let t of tracks; let i = index" class="result-item"> <div class="result-info"> <div class="title">{{ t.name }}</div> <div class="subtitle">{{ t.artists.map(a => a.name).join(', ') }}</div> </div> <div class="result-actions"> <button (click)="playTrack(i)">Play</button> </div> </div> </div> </div> </div>
