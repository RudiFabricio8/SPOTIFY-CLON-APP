<div class="player-root"> <div class="player-card"> <div class="player-cover"> <img *ngIf="currentTrack?.album.images?.length" [src]="currentTrack?.album.images[0].url" [alt]="currentTrack?.name" /> </div> <div class="player-info"> <h2>{{ currentTrack?.name }}</h2> <p>{{ currentTrack?.artists.map(a => a.name).join(', ') }}</p> <div class="controls"> <button (click)="playPrevious()">Prev</button> <button (click)="playNext()">Next</button> </div> <div class="progress" (click)="$event.stopPropagation()"> <div class="progress-bar" [style.width.%]="progress"></div> <div class="progress-rail" (click)="seek(($event.offsetX / ( $event.target as HTMLElement ).clientWidth) * 100)"></div> </div> <audio #audio (timeupdate)="onTimeUpdate($event)"> <source *ngIf="currentTrack?.preview_url" [src]="currentTrack?.preview_url" type="audio/mpeg" /> </audio> </div> </div> </div>
